name: Lite installer candidates
on:
  push:
    branches: [main, 'feat/lite-native-installers']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac-arm64
          - runner: windows-2025
            platform: win-x64
    name: Build and test Lite (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Ensure NSIS is installed on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - run: npm ci
      - run: npm run package:lite
      - run: npm run package:lite-bundle
      - run: node lite/smoke.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Smoke test minimum supported Node.js
        run: node lite/smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: pantry-lite-${{ matrix.platform }}-${{ github.sha }}
          path: |
            lite-dist/*.dmg
            lite-dist/*.exe
            lite-dist/*-Lite-Bundle.tar.gz
            lite-dist/lite-update-manifest.json
          if-no-files-found: error
